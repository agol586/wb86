<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Mac Wubi 86 icon</title>
  <desc id="description">An abstract Chinese five glyph assembled from warm keyboard keys on a deep teal macOS icon.</desc>
  <defs>
    <linearGradient id="background" x1="122" y1="84" x2="862" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#164f49"/>
      <stop offset="0.52" stop-color="#073b3a"/>
      <stop offset="1" stop-color="#032a2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(512 270) rotate(90) scale(570)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a7569" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2a7569" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ivory" x1="512" y1="202" x2="512" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf2"/>
      <stop offset="0.72" stop-color="#f2ecd8"/>
      <stop offset="1" stop-color="#d8ccb0"/>
    </linearGradient>
    <linearGradient id="gold" x1="512" y1="646" x2="512" y2="812" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc75b"/>
      <stop offset="0.65" stop-color="#e9a82f"/>
      <stop offset="1" stop-color="#b87016"/>
    </linearGradient>
    <filter id="keyShadow" x="-20%" y="-30%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#001719" flood-opacity="0.52"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#001719" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#background)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#glow)"/>
  <rect x="47" y="47" width="930" height="930" rx="205" fill="none" stroke="#87b7a5" stroke-opacity="0.15" stroke-width="3"/>

  <g filter="url(#keyShadow)">
    <rect x="236" y="206" width="552" height="154" rx="50" fill="url(#ivory)"/>
    <rect x="252" y="220" width="520" height="111" rx="36" fill="#ffffff" fill-opacity="0.22"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="190" y="414" width="286" height="184" rx="54" fill="url(#ivory)"/>
    <rect x="548" y="414" width="286" height="184" rx="54" fill="url(#ivory)"/>
    <rect x="206" y="430" width="254" height="130" rx="40" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="564" y="430" width="254" height="130" rx="40" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <g filter="url(#keyShadow)">
    <rect x="236" y="648" width="552" height="164" rx="50" fill="url(#gold)"/>
    <rect x="252" y="662" width="520" height="116" rx="36" fill="#fff1b0" fill-opacity="0.22"/>
  </g>
</svg>
